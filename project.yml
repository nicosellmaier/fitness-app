name: Form
options:
  bundleIdPrefix: de.nicosellmaier
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Form:
    type: application
    platform: iOS
    sources:
      - path: Form
    info:
      path: Form/Info.plist
      properties:
        CFBundleDisplayName: Form
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: "Form liest deine Schlaf-, Herz-, Trainings- und Gesundheitsdaten, um Erholung, Schlaf und Training auszuwerten."
        NSHealthUpdateUsageDescription: "Form speichert Trainings, die du in der App anlegst, in Apple Health."
    entitlements:
      path: Form/Form.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.nicosellmaier.form
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
schemes:
  Form:
    build:
      targets:
        Form: all
